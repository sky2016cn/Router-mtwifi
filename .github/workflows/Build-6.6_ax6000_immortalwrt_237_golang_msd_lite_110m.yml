name: Build-6.6_ax6000_immortalwrt_237_golang_msd_lite_110m

on:
  workflow_dispatch:
    inputs:
      clean_toolchain:
        description: '是否清理已缓存的工具链（强制重新编译）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
#  schedule:
#    - cron: '0 18 */3 * *'

permissions: write-all

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6.git
  REPO_BRANCH: openwrt-24.10-6.6
  CONFIG_CUSTOM: scripts/Redmi-AX6000/CUSTOMIZE-AX6000.txt
  DIY_SCRIPT: scripts/diy-script.sh
  DIY_SCRIPT_2: scripts/diy-6.6.sh
  CACHE_TOOLCHAIN: true
  UPLOAD_BIN_DIR: true
  FIRMWARE_RELEASE: true
  FIRMWARE_TAG: Redmi_AX6000
  TZ: Asia/Shanghai

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
    - name: Free disk space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: false

    - name: Initialization Environment(初始化环境)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo mkdir -p /etc/apt/preferences.d
        sudo tee /etc/apt/preferences.d/nosnap.pref > /dev/null << 'EOF'
        Package: snapd
        Pin: release a=*
        Pin-Priority: -10
        EOF
        sudo apt-get purge -y snapd
        sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo -E apt -yqq install dos2unix libfuse-dev
        sudo -E apt -yqq autoremove --purge
        sudo -E apt -yqq autoclean
        sudo -E apt -yqq clean
        sudo -E systemctl daemon-reload
        sudo timedatectl set-timezone "$TZ"

    - name: Checkout
      uses: actions/checkout@v5

    - name: Clone Source Code(克隆源代码)
      run: |
        df -hT $GITHUB_WORKSPACE
        git clone "$REPO_URL" -b "$REPO_BRANCH" openwrt
        cd openwrt
        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV
        VERSION_INFO=$(git show -s --date=short --format="作者: %an<br/>时间: %cd<br/>内容: %s<br/>hash: %H")
        echo "VERSION_INFO=$VERSION_INFO" >> $GITHUB_ENV

       # =========== 在更新feeds 命令之前，先修改源码里的 filogic.mk 文件 和 添加 dts 文件 ===========
    - name: Patch AX6000 110M Partition(修改 110M 大分区文件)
      run: |
        # 本地仓库 /scripts/Redmi-AX6000/xiaomi_redmi-router-ax6000-110m.txt 文件内的所有内容，追加 AX6000 110M 补丁内容到 /target/linux/mediatek/image/filogic.mk 末尾
        DTS_MK_TXT="$GITHUB_WORKSPACE/scripts/Redmi-AX6000/xiaomi_redmi-router-ax6000-110m.txt"
        TARGET_MK="$OPENWRT_PATH/target/linux/mediatek/image/filogic.mk"
        if [ -f "$DTS_MK_TXT" ] && [ -f "$TARGET_MK" ]; then
          cat "$DTS_MK_TXT" >> "$TARGET_MK"
          echo "Successfully appended AX6000 110M profile to filogic.mk"
        else
          echo "Warning: $DTS_MK_TXT or $TARGET_MK does not exist!"
        fi
        
        # 复制本地仓库 /scripts/Redmi-AX6000/mt7986a-xiaomi-redmi-router-ax6000-110m.dts 文件到 target/linux/mediatek/dts/ 目录
        DTS_FILE="$GITHUB_WORKSPACE/scripts/Redmi-AX6000/mt7986a-xiaomi-redmi-router-ax6000-110m.dts"
        TARGET_DTS_DIR="$OPENWRT_PATH/target/linux/mediatek/dts"
        if [ -f "$DTS_FILE" ]; then
          mkdir -p "$TARGET_DTS_DIR"
          cp -f "$DTS_FILE" "$TARGET_DTS_DIR/"
          echo "Successfully copied DTS file to $TARGET_DTS_DIR"
        else
          echo "Warning: DTS file $DTS_FILE not found!"
        fi
        
    - name: Update Feeds(更新feeds)
      run: |
        cd "$OPENWRT_PATH"
        ./scripts/feeds update -a   
        ./scripts/feeds install -a
        ./scripts/feeds install -a

    - name: 基础配置 mt7986-ax6000.config 复制到根目录并重命名 .config
      run: |
        cd "$OPENWRT_PATH"
        if [ -f "defconfig/mt7986-ax6000.config" ]; then
          cp -f defconfig/mt7986-ax6000.config .config
          echo "Successfully loaded base config from源码目录: defconfig/mt7986-ax6000.config"
        else
          echo "Error: defconfig/mt7986-ax6000.config not found in $OPENWRT_PATH" && exit 1
        fi

    - name: Load Custom Configuration(加载自定义配置)
      run: |
        # 1. 如果根目录下有自定义 files 文件夹，复制到源码目录
        if [ -d "$GITHUB_WORKSPACE/files" ]; then
          mkdir -p "$OPENWRT_PATH/files"
          cp -rf "$GITHUB_WORKSPACE/files"/. "$OPENWRT_PATH/files/"
          echo "Successfully loaded custom files."
        fi

        # 2. 追加 /scripts/Redmi-AX6000/CUSTOMIZE-AX6000.txt 到 .config
        CUSTOM_FILE="$GITHUB_WORKSPACE/${CONFIG_CUSTOM:-scripts/Redmi-AX6000/CUSTOMIZE-AX6000.txt}"
        if [ -f "$CUSTOM_FILE" ]; then
          cat "$CUSTOM_FILE" >> "$OPENWRT_PATH/.config"
          echo "Successfully appended custom config from: $CUSTOM_FILE"
        else
          echo "Error: Custom config file $CUSTOM_FILE not found!" && exit 1
        fi

        # 3. 执行 scripts/ 目录下的 DIY 脚本
        cd "$OPENWRT_PATH"

        if [ -n "$DIY_SCRIPT" ] && [ -f "$GITHUB_WORKSPACE/$DIY_SCRIPT" ]; then
          echo "Executing DIY Script 1: $GITHUB_WORKSPACE/$DIY_SCRIPT"
          chmod +x "$GITHUB_WORKSPACE/$DIY_SCRIPT"
          "$GITHUB_WORKSPACE/$DIY_SCRIPT"
        fi

        if [ -n "$DIY_SCRIPT_2" ] && [ -f "$GITHUB_WORKSPACE/$DIY_SCRIPT_2" ]; then
          echo "Executing DIY Script 2: $GITHUB_WORKSPACE/$DIY_SCRIPT_2"
          chmod +x "$GITHUB_WORKSPACE/$DIY_SCRIPT_2"
          "$GITHUB_WORKSPACE/$DIY_SCRIPT_2"
        fi

        # 4. 补全展开配置
        make defconfig

    - name: Generate Variables(生成变量)
      run: |
        cd "$OPENWRT_PATH"
        SOURCE_REPO="$(echo "$REPO_URL" | awk -F '/' '{print $(NF)}')"
        SOURCE_REPO="${SOURCE_REPO%.git}"
        echo "SOURCE_REPO=$SOURCE_REPO" >> $GITHUB_ENV
        DEVICE_TARGET=$(grep CONFIG_TARGET_BOARD .config | awk -F '"' '{print $2}')
        echo "DEVICE_TARGET=$DEVICE_TARGET" >> $GITHUB_ENV
        DEVICE_SUBTARGET=$(grep CONFIG_TARGET_SUBTARGET .config | awk -F '"' '{print $2}')
        echo "DEVICE_SUBTARGET=$DEVICE_SUBTARGET" >> $GITHUB_ENV
        DEVICE_PROFILE=$(grep '^CONFIG_TARGET_.*DEVICE_.*=y$' .config | sed 's/^CONFIG_TARGET_//; s/=y$//' | tail -n 1)
        echo "DEVICE_PROFILE=$DEVICE_PROFILE" >> $GITHUB_ENV

    - name: Cache Clean(清理缓存)
      if: github.event.inputs.clean_toolchain == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh cache delete --all || true

    - name: Cache Toolchain(缓存工具链)
      if: env.CACHE_TOOLCHAIN == 'true'
      uses: HiGarfield/cachewrtbuild@main
      with:
        ccache: true
        toolchain: true
        mixkey: ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}
        prefix: ${{ env.OPENWRT_PATH }}

    - name: Download DL Package(下载DL软件包)
      run: |
        cd "$OPENWRT_PATH"
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware(开始编译固件)
      id: compile
      run: |
        cd "$OPENWRT_PATH"
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        echo "DATE=$(date +"%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +"%Y.%m.%d")" >> $GITHUB_ENV

    - name: Check Space Usage(检查空间使用情况)
      if: (!cancelled())
      run: df -hT

    - name: Upload Bin Directory(上传bin目录)
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.SOURCE_REPO }}-bin-${{ env.FIRMWARE_TAG }}-${{ env.FILE_DATE }}
        path: ${{ env.OPENWRT_PATH }}/bin

    - name: Organize Files(整理文件)
      if: steps.compile.outputs.status == 'success'
      run: |
        cd "$OPENWRT_PATH"/bin/targets/*/*
        cat sha256sums
        echo "VERSION_KERNEL=$(find -type f -name "*.manifest" -exec grep -oP '^kernel - \K.*?(?=~|-\d+-)' {} \;)" >> $GITHUB_ENV
        cp "$OPENWRT_PATH"/.config build.config
        mkdir -p packages
        [ -d "$OPENWRT_PATH"/bin/packages ] && find "$OPENWRT_PATH"/bin/packages -type f -name "*.ipk" -exec cp -f {} packages \;
        [ -d packages ] && tar -zcf packages.tar.gz packages || true
        rm -rf feeds.buildinfo version.buildinfo
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV

    - name: Upload Firmware To Artifact(将固件上传到Artifact)
      if: steps.compile.outputs.status == 'success' && env.FIRMWARE_RELEASE != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.SOURCE_REPO }}-firmware-${{ env.FIRMWARE_TAG }}-${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE_PATH }}

    - name: Upload Firmware To Release(发布固件)
      if: success() && env.FIRMWARE_RELEASE == 'true'
      uses: ncipollo/release-action@v1
      with:
        name: ImmortalWrt ${{ env.FIRMWARE_TAG }} (${{ env.DATE }})
        allowUpdates: true
        tag: ${{ env.FIRMWARE_TAG }}-${{ env.VERSION_KERNEL }}
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: |
          ${{ env.FIRMWARE_PATH }}/*.bin
          ${{ env.FIRMWARE_PATH }}/*.ubi
          ${{ env.FIRMWARE_PATH }}/*.manifest
          ${{ env.FIRMWARE_PATH }}/*.buildinfo
          ${{ env.FIRMWARE_PATH }}/*.json
          ${{ env.FIRMWARE_PATH }}/*.tar.gz
        body: |
          **This is OpenWrt Firmware for ${{ env.FIRMWARE_TAG }}**
          ### 固件信息(${{ env.DEVICE_PROFILE }})
          - 默认地址: 192.168.2.1
          - 默认密码: 无
          - 固件内核版本：${{ env.VERSION_KERNEL }}
          - 固件源码: ${{ env.REPO_URL }}
          - 源码分支: ${{ env.REPO_BRANCH }}
          - 固件编译前最后一次➦[源码更新记录](${{ env.REPO_URL }})
          - ${{ env.VERSION_INFO }}
